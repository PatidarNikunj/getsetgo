# Runs on every pull request and on main. Render deploys only after this passes (autoDeployTrigger:
# checksPass); make "CI / checks" and "CI / e2e" required in branch protection (docs/cloud.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege (OWASP A01/A08): jobs only read the repo unless they say otherwise.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: checks (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Third-party actions are pinned to commits (tags can be moved); Dependabot updates them.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (pnpm version from package.json)
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/ai/uv.lock
      - run: pnpm install --frozen-lockfile
      - name: Python deps (apps/ai)
        working-directory: apps/ai
        run: uv sync --frozen
      - name: Formatting
        run: pnpm format:check
      - name: Lint, type-check, unit tests and build (all apps and packages)
        run: pnpm turbo run lint typecheck test build
      - name: Generated code is up to date
        run: |
          pnpm --filter @getsetgo/graphql codegen
          (cd apps/ai && uv run python scripts/export_openapi.py)
          pnpm --filter @getsetgo/api ai:types
          git diff --exit-code -- packages/graphql/src/generated apps/ai/openapi.json apps/api/src/ai/ai-api.d.ts \
            || (echo "::error::Generated code is stale. Run the codegen commands in CLAUDE.md and commit." && exit 1)

  e2e:
    name: e2e (API + both web apps, Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Local env files with random passwords
        run: pnpm infra:env
      - name: Start databases, api and ai (Docker, production images)
        run: docker compose --profile apps up -d --build --wait
      - name: API end-to-end tests (Jest against real databases)
        run: pnpm --filter @getsetgo/api test:e2e
      - name: Install Chromium for Playwright
        run: pnpm --filter @getsetgo/web-shadcn exec playwright install --with-deps chromium
      - name: Web end-to-end + accessibility tests (builds both apps)
        run: pnpm test:e2e
      - name: Container logs
        if: failure()
        run: docker compose --profile apps logs --tail 200
      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/*/playwright-report
            apps/*/test-results
          retention-days: 7

  audit:
    name: dependency audit (OWASP A06)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: npm packages (production dependencies, high and critical)
        run: pnpm audit --prod --audit-level=high
      - name: Python packages (apps/ai)
        working-directory: apps/ai
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt > /tmp/requirements.txt
          # Audit on the project's Python (apps/ai/.python-version); some deps don't support 3.14 yet.
          uvx --python 3.13 pip-audit --strict --requirement /tmp/requirements.txt

  docker:
    name: docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Covered by the e2e job on PRs; on main, also prove the images Render will build still build.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f apps/api/Dockerfile -t getsetgo-api:ci .
      - run: docker build -f apps/ai/Dockerfile -t getsetgo-ai:ci .
