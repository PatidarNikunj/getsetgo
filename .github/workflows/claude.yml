# Claude Code on GitHub: responds only when someone with write access mentions @claude in an
# issue, PR comment or review. Needs the ANTHROPIC_API_KEY repository secret (docs/cloud.md).
# Claude follows CLAUDE.md and the constitution, like it does locally.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push commits to its branch
      pull-requests: write # comment on and open PRs
      issues: write
      id-token: write
      actions: read # read CI results to fix failures
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1.0.289
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
