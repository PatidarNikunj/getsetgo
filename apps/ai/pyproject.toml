[project]
name = "getsetgo-ai"
version = "0.1.0"
description = "Internal AI service for getsetgo: Claude-powered agents behind a service-to-service JWT."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20",
    "anthropic>=2.12",
    "asyncpg>=0.32",
    "beanie>=2.2",
    "fastapi>=0.165",
    "pydantic-settings>=2.16",
    "pyjwt>=2.10",
    "sentry-sdk[fastapi]>=3.0",
    "sqlalchemy[asyncio]>=2.1",
    "structlog>=25",
    "uvicorn[standard]>=0.38",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.4",
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F/W: pycodestyle+pyflakes, I: isort, B: bugbear, UP: pyupgrade, S: bandit (security),
# ASYNC: async pitfalls, N: naming, SIM: simplify, RUF: ruff-specific
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert and dummy secrets are fine in tests
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
