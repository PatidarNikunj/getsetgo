packages:
  - apps/*
  - packages/*

# Reviewed install scripts we don't need: protobufjs only prints a notice; @parcel/watcher and
# sharp ship prebuilt binaries; unrs-resolver is optional; Prisma's client is generated by our
# own postinstall and its engines are fetched in the Dockerfile.
ignoredBuiltDependencies:
  - "@apollo/protobufjs"
  - "@parcel/watcher"
  - sharp
  - prisma
  - unrs-resolver

# Supply-chain hardening (OWASP A06/A08): don't install versions published in the last 24h.
minimumReleaseAge: 1440

# Only these packages may run install scripts; extend deliberately when adding deps.
onlyBuiltDependencies: []

# Patches apply to the web apps only; Docker builds of the api deploy a subset of the workspace
# where they're unused, which pnpm would otherwise treat as an error.
allowUnusedPatches: true

# sonner: stop it injecting a <style> tag (strict CSP); see docs/frontends.md.
patchedDependencies:
  sonner@2.0.8: patches/sonner@2.0.8.patch
